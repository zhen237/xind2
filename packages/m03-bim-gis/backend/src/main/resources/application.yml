server:
  port: ${SERVER_PORT:8083}

spring:
  config:
    import:
      - classpath:application-shared.yml
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/comm_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    table: flyway_schema_history_m03
    locations: classpath:db/migration
    baseline-on-migrate: true
  redis:
    database: ${REDIS_DB:3}
  cache:
    redis:
      key-prefix: "m03:"
      use-key-prefix: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.comm.m03.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

security:
  permit-paths:
    - /api/m03/health/**
    # QGIS 插件调用 API（内网，无需 JWT；生产环境应改为 API Key 鉴权）
    - /api/m03/design/generate
    - /api/m03/design/upload
    - /api/m03/design/task/**
    - /api/m03/design/template/**
    - /api/m03/design/scheme/**
    - /api/m03/design/sites/**
    # 只读查询开放（注意：真实控制器映射无 /list 后缀，须与共享配置一致）
    - /api/m03/project
    - /api/m03/region
    - /api/m03/model
    # 大模型辅助设计接口：免 Security JWT，改由 LlmAuthInterceptor 提供
    # 「JWT 或 X-API-Key」双通道（前端走 JWT，QGIS 插件/内部服务走 X-API-Key）

    - /api/m03/llm/**
    # FTTH 真实数据集只读查询（内部设计成果，内网免鉴权；生产应收紧为 JWT / API Key）
    - /api/m03/ftth/**

logging:
  level:
    com.comm.m03: ${LOG_LEVEL:INFO}

management:
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}

# Python 拓扑规划引擎（规格 §3.1：M03 后端 → HTTP 调拓扑引擎）
topology:
  engine:
    url: ${TOPOLOGY_ENGINE_URL:http://localhost:9001}
    timeout-ms: 1000

# S3 智能审查模块联调（M03 → S3 /api/v1/s3/review/s1/receive，白名单免 token）
s3:
  review:
    url: ${S3_REVIEW_URL:http://localhost:8089}
    timeout-ms: ${S3_REVIEW_TIMEOUT_MS:10000}
    enabled: ${S3_REVIEW_ENABLED:true}

# 大模型辅助设计微服务（落地路线：M03 后端 → HTTP 调 llm-service，仅本机 127.0.0.1:9002）
llm:
  service:
    url: ${LLM_SERVICE_URL:http://localhost:9002}
    timeout-ms: ${LLM_SERVICE_TIMEOUT_MS:60000}

# 内部接口 API Key（design 写删接口鉴权；QGIS 插件与内部服务调用须携带 X-API-Key 头）
m03:
  api-key: ${M03_API_KEY:CHANGE_ME}

# CORS 允许的前端源白名单（逗号分隔；生产部署请通过 CORS_ALLOWED_ORIGINS 环境变量覆盖）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9000,http://localhost:8080,http://127.0.0.1:9000}

# FTTH 真实数据集目录（QGIS 插件 ftth 导出链生成的 ftth-*.json；
# 相对 backend 模块根，可用 FTTH_DATA_DIR 环境变量覆盖，便于部署时指向实际数据位置）
ftth:
  data-dir: ${FTTH_DATA_DIR:../frontend/public/datasets}
