server:
  port: ${SERVER_PORT:8083}

spring:
  config:
    import:
      - classpath:application-shared.yml
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/comm_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    table: flyway_schema_history_m03
    locations: classpath:db/migration
    baseline-on-migrate: true
  redis:
    database: ${REDIS_DB:3}
  cache:
    redis:
      key-prefix: "m03:"
      use-key-prefix: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.comm.m03.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

security:
  permit-paths:
    - /api/m03/health/**
    # QGIS 插件调用 API（内网，无需 JWT；生产环境应改为 API Key 鉴权）
    - /api/m03/design/generate
    - /api/m03/design/upload
    - /api/m03/design/task/**
    - /api/m03/design/template/**
    - /api/m03/design/scheme/**
    - /api/m03/design/sites/**
    # 只读查询开放
    - /api/m03/project/list
    - /api/m03/region/list
    - /api/m03/model/list

logging:
  level:
    com.comm.m03: ${LOG_LEVEL:INFO}

management:
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}

# Python 拓扑规划引擎（规格 §3.1：M03 后端 → HTTP 调拓扑引擎）
topology:
  engine:
    url: ${TOPOLOGY_ENGINE_URL:http://localhost:9001}
    timeout-ms: 5000
