server:
  port: ${SERVER_PORT:8082}

spring:
  config:
    import:
      - classpath:application-shared.yml
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/comm_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    table: flyway_schema_history_s2
    locations: classpath:db/migration
    baseline-on-migrate: true
    # ⚠️ 必须显式为 0，否则 V1 会被当成 BASELINE 跳过：V1 不建表 → V2 的
    # ALTER TABLE s2_gis_feature 直接报 "Table ... doesn't exist" 启动失败。
    # 见 docs/数据库迁移遗留问题-修复方案.md
    baseline-version: 0
  cache:
    type: none

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.comm.s2.entity
  configuration:
    map-underscore-to-camel-case: true

# ⚠️ 本模块原先在此定义 security.permit-paths，但该配置【不生效】：
#    spring.config.import 引入的 classpath:application-shared.yml 优先级更高，会覆盖模块级同名属性。
#    统一维护入口：packages/shared/backend/src/main/resources/application-shared.yml
#    原清单（如需真正放行，请先评估公网暴露面后再搬到 application-shared.yml）：
#      - /api/v1/s2/health/**
#      - /api/v1/s2/internal/**

logging:
  level:
    com.comm.s2: ${LOG_LEVEL:INFO}
