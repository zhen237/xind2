# =====================================================================
# CAD 图层命名规范 → GIS 要素类型映射配置（FR-2 / FR-3）
# 图层模式匹配支持通配符（fnmatch，不区分大小写）；
# attributes 定义属性提取规则：
#   pattern + from(layer_name|entity_elevation|entity_text)  正则提取
#   default                                                   缺省值
# =====================================================================

feature_types:
  building_outline:            # 建筑轮廓 → Polygon
    geometry: Polygon
    layer_patterns:
      - "*建筑*"
      - "*jianzhu*"
      - "JZW*"
      - "BUILDING*"
      - "A-*WALL*"
    attributes:
      floors:
        pattern: 'F(\d+)|(\d+)F'
        from: layer_name
        default: 1
      usage:
        default: "通信机房"

  road_centerline:            # 道路中心线 → LineString
    geometry: LineString
    layer_patterns:
      - "*道路*"
      - "*daolu*"
      - "DL-*"
      - "ROAD*"
      - "*CENTERLINE*"
    attributes:
      road_class:
        default: "支路"

  power_line:                 # 电力线路 → LineString
    geometry: LineString
    layer_patterns:
      - "*电力*"
      - "*dianli*"
      - "DLX-*"
      - "POWER*"
      - "GD*"
    attributes:
      voltage_kv:             # 从图层名提取电压等级，如 DLX-110kV → 110
        pattern: '(\d+(?:\.\d+)?)\s*[kK][vV]'
        from: layer_name
        default: 10
      usage:
        default: "输电线路"

  well_point:                 # 管井位置 → Point
    geometry: Point
    layer_patterns:
      - "*管井*"
      - "*guanjing*"
      - "GJ-*"
      - "WELL*"
      - "*MANHOLE*"
    attributes:
      well_type:
        default: "通信管道井"

  contour:                    # 地形等高线 → LineString + 高程
    geometry: LineString
    layer_patterns:
      - "*等高线*"
      - "DGX-*"
      - "CONTOUR*"
    attributes:
      elevation:              # 取实体自身高程（组码 38 / Z 值）
        from: entity_elevation
        default: 0

  redline:                    # 红线范围 → Polygon
    geometry: Polygon
    layer_patterns:
      - "*红线*"
      - "*hongxian*"
      - "HX-*"
      - "REDLINE*"
      - "*用地界*"
    attributes:
      usage:
        default: "建设用地红线"

# 未匹配图层的处理：skip（忽略）/ other（归入 other 要素）
unmatched: other

# 坐标转换默认参数（可被 CLI / API 参数覆盖）
transform_defaults:
  source_crs: "cgcs2000_gk111"   # CGCS2000 3度带高斯投影，中央经线 111°E（运城区域）
  target_crs: "EPSG:4326"        # 统一归一到 WGS84
