server:
  port: ${SERVER_PORT:8084}

spring:
  config:
    import:
      - classpath:application-shared.yml
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/comm_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    table: flyway_schema_history_m04
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: never
      schema-locations: classpath:init-m04-acceptance.sql
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  cache:
    type: none

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.comm.m04.entity
  configuration:
    map-underscore-to-camel-case: true

security:
  permit-paths:
    - /api/m04/project/list
    - /api/m04/work-order/list
    - /api/m04/health/**
    - /api/m04/internal/**

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucket: m04-media
