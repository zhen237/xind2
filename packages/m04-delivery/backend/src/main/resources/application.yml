server:
  port: ${SERVER_PORT:8084}

spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    table: flyway_schema_history_m04
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: never
      schema-locations: classpath:init-m04-acceptance.sql
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.comm.m04.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:604800000}

security:
  permit-paths:
    - /api/m04/project/list
    - /api/m04/work-order/list
    - /api/m04/health/**
    - /api/m04/internal/**

minio:
  endpoint: ${MINIO_ENDPOINT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucket: m04-media
