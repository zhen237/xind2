server:
  port: 8090

spring:
  application:
    name: s4-bom-transform
  datasource:
    url: jdbc:mysql://localhost:3306/comm_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  # Flyway — 启动时自动执行 db/migration/V1__s4_init.sql 建表
  # baseline-on-migrate: 已有表的历史环境跳过基线前的迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.commplatform.s4.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ============ S4 专属配置 ============
s4:
  # Python BOM 引擎地址（FastAPI）
  engine:
    url: http://localhost:8100
    timeout-seconds: 60
    retry: 1
  # BOM 导出路径（MinIO 或本地文件）
  export:
    storage: local
    local-path: ./exports/bom
  # 跨赛题集成（S1/S3/S5）— dataSource: mock 走 dev-proxy(8090)；real 走各子题真实地址
  integration:
    data-source: mock
    s1-url: http://localhost:8090
    s3-url: http://localhost:8090
    s5-url: http://localhost:8090
    auth-token: ""
    timeout-seconds: 15
  # CORS 允许来源（前端 5190，real 联调时可追加）
  cors:
    allowed-origins:
      - http://localhost:5190
      - http://127.0.0.1:5190
    max-age-seconds: 3600

logging:
  level:
    com.commplatform.s4: DEBUG
