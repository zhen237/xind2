server:
  port: 8090

spring:
  application:
    name: s4-bom-transform
  datasource:
    url: jdbc:mysql://localhost:3306/comm_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  # Flyway — 启动时自动执行 classpath:db/migration/V1__s4_init.sql 建表
  # ⚠️ 迁移文件必须放在 src/main/resources/db/migration/ 下：
  #    本文件原先被放在 db/V1__s4_init.sql（少了 migration/ 一级），
  #    导致 Flyway 扫不到任何迁移、s4 的表实际从未由迁移创建过。
  #    已于 2026-09-15 移到正确目录。详见
  #    docs/数据库迁移遗留问题-修复方案.md 附带发现 A。
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 每个模块必须独占一张历史表：多模块共用 comm_platform，
    # 若都用默认名 flyway_schema_history 会互相污染版本号/checksum/baseline。
    table: flyway_schema_history_s4
    baseline-on-migrate: true
    # 必须为 0：默认值 1 会让 V1 被视为"已随 baseline 应用"而被跳过，
    # 后续若存在 V2（对 V1 建的表做 ALTER）就会报表不存在。
    # 详见 docs/数据库迁移遗留问题-修复方案.md §2.5。
    baseline-version: 0

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.commplatform.s4.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ============ S4 专属配置 ============
s4:
  # Python BOM 引擎地址（FastAPI）
  engine:
    url: http://localhost:8100
    timeout-seconds: 60
    retry: 1
  # BOM 导出路径（MinIO 或本地文件）
  export:
    storage: local
    local-path: ./exports/bom
  # 跨赛题集成（S1/S3/S5）— dataSource: mock 走 dev-proxy(8090)；real 走各子题真实地址
  # 本地联调默认使用真实服务端口；服务不可达时 S4 会降级返回演示数据，保证 UI 不为空。
  integration:
    data-source: real
    s1-url: http://localhost:8083
    s3-url: http://localhost:8089
    s5-url: http://localhost:8091
    auth-token: ""
    timeout-seconds: 15
  # CORS 允许来源（前端 5190，real 联调时可追加）
  cors:
    allowed-origins:
      - http://localhost:5190
      - http://127.0.0.1:5190
    max-age-seconds: 3600

logging:
  level:
    com.commplatform.s4: DEBUG
