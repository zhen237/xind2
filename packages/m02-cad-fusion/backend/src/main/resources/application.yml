server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/comm_platform?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:Admin@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    time-zone: Asia/Shanghai

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads/m02}
  max-size: 524288000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.comm.m02.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET:your-strong-secret-change-in-production}
  expiration: ${JWT_EXPIRATION:604800000}

logging:
  level:
    com.comm.m02: DEBUG
