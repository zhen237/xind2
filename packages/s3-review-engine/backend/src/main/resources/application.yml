server:
  port: ${SERVER_PORT:8089}

spring:
  config:
    import:
      - classpath:application-shared.yml
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/comm_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    table: flyway_schema_history_s3
    locations: classpath:db/migration
    baseline-on-migrate: true
  cache:
    type: none

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.comm.s3.entity
  configuration:
    map-underscore-to-camel-case: true

security:
  permit-paths:
    - /api/v1/s3/health/**
    - /api/v1/s3/internal/**

logging:
  level:
    com.comm.s3: ${LOG_LEVEL:INFO}
