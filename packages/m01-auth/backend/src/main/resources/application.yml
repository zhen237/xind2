server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - classpath:application-shared.yml
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/comm_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cache:
    type: none

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.comm.m01.entity
  configuration:
    map-underscore-to-camel-case: true

security:
  permit-paths:
    - /api/m01/auth/login
    - /api/m01/health/**
