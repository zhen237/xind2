# =============================================================================
# xind2 通信基建数智化全流程平台 — Nginx 站点配置 (Ubuntu 22.04)
# -----------------------------------------------------------------------------
# 部署说明：
#   - 服务器防火墙仅开放 22/80/ICMP，:80 是唯一公网入口（本 Nginx）。
#   - 所有后端（Java/Node/Python）仅绑定 127.0.0.1，由本 Nginx 反代 /api/* 转发。
#   - 静态前端按子路径挂载：portal 在根，其余模块在 /modules/<xx>/。
#
# 安装：
#   sudo cp xind2.conf /etc/nginx/sites-available/xind2.conf
#   sudo ln -sf /etc/nginx/sites-available/xind2.conf /etc/nginx/sites-enabled/xind2.conf
#   sudo rm -f /etc/nginx/sites-enabled/default        # 避免 default 站点冲突
#   sudo nginx -t && sudo systemctl reload nginx
#
# 约定（与 start-backends.sh / README.md 一致）：
#   前端产物目录：/opt/xind2/dist/<module>/
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 大文件上传（DXF / Excel 等）
    client_max_body_size 50m;

    # 基础安全头（可选）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # -------------------------------------------------------------------------
    # 1) 静态前端（SPA）
    #    根路径 = m06-portal；其余模块挂在 /modules/<xx>/
    #    说明：HTML5 history 模式（m04/s2/s4/s5）需 try_files 回退到 index.html；
    #          hash 模式（m03/s3）同样兼容。
    # -------------------------------------------------------------------------

    # 根：m06-portal
    location / {
        root /opt/xind2/dist/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 无尾斜杠 301 到带斜杠：门户 iframe 用 /modules/xx（无斜杠）拼 URL，
    # 静态 alias location 不会自动补斜杠，缺这条会嵌套加载门户自身导致白屏

    # 入口 index.html 禁缓存（no-cache）：模块更新后浏览器必须拿到新入口；
    # assets 带 content hash 仍可长缓存。root+rewrite 写法，勿用 alias 指文件
    # （alias 会叠加 index 指令生成 index.htmlindex.html 导致 500）。
    location = / {
        root /opt/xind2/dist/portal;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /modules/m03/ { root /opt/xind2/dist/m03; rewrite ^ /index.html break; add_header Cache-Control "no-cache"; }
    location = /modules/m04/ { root /opt/xind2/dist/m04; rewrite ^ /index.html break; add_header Cache-Control "no-cache"; }
    location = /modules/s2/  { root /opt/xind2/dist/s2;  rewrite ^ /index.html break; add_header Cache-Control "no-cache"; }
    location = /modules/s3/  { root /opt/xind2/dist/s3;  rewrite ^ /index.html break; add_header Cache-Control "no-cache"; }
    location = /modules/s4/  { root /opt/xind2/dist/s4;  rewrite ^ /index.html break; add_header Cache-Control "no-cache"; }
    location = /modules/s5/  { root /opt/xind2/dist/s5;  rewrite ^ /index.html break; add_header Cache-Control "no-cache"; }

    location = /modules/m03 { return 301 /modules/m03/; }
    location = /modules/m04 { return 301 /modules/m04/; }
    location = /modules/s2  { return 301 /modules/s2/; }
    location = /modules/s3  { return 301 /modules/s3/; }
    location = /modules/s4  { return 301 /modules/s4/; }
    location = /modules/s5  { return 301 /modules/s5/; }

    # /modules/m03/  -> m03-bim-gis（hash history，base=/modules/m03/）
    location /modules/m03/ {
        alias /opt/xind2/dist/m03/;
        index index.html;
        try_files $uri $uri/ /modules/m03/index.html;
    }

    # /modules/s3/   -> s3-review-engine（hash history，base=/modules/s3/）
    location /modules/s3/ {
        alias /opt/xind2/dist/s3/;
        index index.html;
        try_files $uri $uri/ /modules/s3/index.html;
    }

    # /modules/m04/  -> m04-delivery（HTML5 history，base=/modules/m04/）
    location /modules/m04/ {
        alias /opt/xind2/dist/m04/;
        index index.html;
        try_files $uri $uri/ /modules/m04/index.html;
    }

    # /modules/s2/   -> s2-cad-fusion（HTML5 history，base=/modules/s2/）
    location /modules/s2/ {
        alias /opt/xind2/dist/s2/;
        index index.html;
        try_files $uri $uri/ /modules/s2/index.html;
    }

    # /modules/s4/   -> s4-bom-transform（HTML5 history，base=/modules/s4/）
    location /modules/s4/ {
        alias /opt/xind2/dist/s4/;
        index index.html;
        try_files $uri $uri/ /modules/s4/index.html;
    }

    # /modules/s5/   -> s5-construction-monitor（HTML5 history，base=/modules/s5/）
    location /modules/s5/ {
        alias /opt/xind2/dist/s5/;
        index index.html;
        try_files $uri $uri/ /modules/s5/index.html;
    }

    # S5 Unity WebGL gzip 预压缩产物（.wasm.gz / .framework.js.gz / .data.gz）：
    # Unity loader 要求响应带 Content-Encoding: gzip 由浏览器透明解压，
    # 且 MIME 必须是解压后内容的类型（wasm→application/wasm，否则
    # WebAssembly.instantiateStreaming 会因 MIME 不符失败）。
    # 注意：location 内一旦出现 add_header，server 级 add_header 不再继承，
    # 因此需补齐 nosniff / X-Frame-Options 两个全局安全头。
    location ~* ^/modules/s5/twin-webgl/(Build/.+\.wasm\.gz)$ {
        alias /opt/xind2/dist/s5/twin-webgl/$1;
        types { } default_type application/wasm;
        add_header Content-Encoding gzip;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location ~* ^/modules/s5/twin-webgl/(Build/.+\.framework\.js\.gz)$ {
        alias /opt/xind2/dist/s5/twin-webgl/$1;
        types { } default_type application/javascript;
        add_header Content-Encoding gzip;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location ~* ^/modules/s5/twin-webgl/(Build/.+\.data\.gz)$ {
        alias /opt/xind2/dist/s5/twin-webgl/$1;
        types { } default_type application/octet-stream;
        add_header Content-Encoding gzip;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # -------------------------------------------------------------------------
    # 2) 反向代理：/api/* 按前缀转发到本地后端
    #    注意：proxy_pass 不带 URI，原请求路径原样透传
    #          （如 /api/m01/login -> 后端收到的仍是 /api/m01/login）。
    #    说明：screen 后端(:8087) 与 m07-cv-engine(:8088) 不在此代理
    #          （前者无前端路由、后者为本地内部引擎），详见 README。
    # -------------------------------------------------------------------------

    # m01-auth -> 8080
    location /api/m01 {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # m03-bim-gis -> 8083
    location /api/m03 {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # m04-delivery -> 8084
    location /api/m04 {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # m05-twin-ops -> 8085
    location /api/m05 {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # s2-cad-fusion -> 8096  （注意：应用默认 8082，但全部前端 /api/s2 指向 8096）
    location /api/s2 {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # s3-review-engine -> 8089  （/api/s3 与 /api/v1/s3 两种前缀）
    location /api/s3 {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/s3 {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # s4-bom-transform -> 8090
    location /api/s4 {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # s5-construction-monitor -> 8091
    location /api/s5 {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 未在上述列表中的 /api/* 路径不予代理（避免误转发到任意后端）。
}
