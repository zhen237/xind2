name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 前端 Lint ──────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/m03-bim-gis/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: packages/m03-bim-gis/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: packages/m03-bim-gis/frontend
        run: npx eslint src --ext .js,.vue --max-warnings 0

      - name: Run Prettier check
        working-directory: packages/m03-bim-gis/frontend
        run: npx prettier --check "src/**/*.{js,vue,css,json}"

      # ── QGIS 插件测试 ─────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pytest
        run: pip install pytest pytest-cov

      - name: Run QGIS plugin tests
        working-directory: qgis-plugin
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/m03-bim-gis/frontend/package-lock.json

      - name: Install dependencies
        working-directory: packages/m03-bim-gis/frontend
        run: npm ci

      - name: Build
        working-directory: packages/m03-bim-gis/frontend
        run: npx vite build
        env:
          VITE_BASE: /xind2/

      - name: Copy Cesium static assets
        run: |
          cp -r packages/m03-bim-gis/frontend/node_modules/cesium/Build/Cesium/Workers packages/m03-bim-gis/frontend/dist/Workers
          cp -r packages/m03-bim-gis/frontend/node_modules/cesium/Build/Cesium/Assets packages/m03-bim-gis/frontend/dist/Assets
          cp -r packages/m03-bim-gis/frontend/node_modules/cesium/Build/Cesium/Widgets packages/m03-bim-gis/frontend/dist/Widgets
          cp packages/m03-bim-gis/frontend/node_modules/cesium/Build/Cesium/Cesium.js packages/m03-bim-gis/frontend/dist/Cesium.js

      - name: SPA fallback
        working-directory: packages/m03-bim-gis/frontend/dist
        run: cp index.html 404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/m03-bim-gis/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
