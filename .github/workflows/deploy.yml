# ============================================================
# 自动测试 + 自动部署（五人五分支，各管各的模块）
# 使用前提（需你本人在 GitHub 网页配置两个 Secret）：
#   Settings → Secrets → Actions → New repository secret
#   1) SERVER_HOST  = 47.122.117.17
#   2) SERVER_SSH_KEY = 阿里云 root 的私钥（id_rsa 内容，含首尾 -----BEGIN/END-----）
# 分支命名约定：以 s1~s5 开头，如 s1-design-fix / s4-bom-xxx
#   谁 push 自己的分支 → 只测 + 只部署自己那个模块，互不干扰
# ============================================================

name: 自动测试并部署我的模块

on:
  push:
    branches: ['**']

jobs:
  # ========== 第 1 步：云端自动测试（不占你们 896MB 小服务器）==========
  test:
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 解析分支前缀 (s1~s5)
        id: meta
        run: |
          BR="${{ github.ref_name }}"
          PREFIX=$(echo "$BR" | grep -oE '^s[1-5]' | head -1)
          if [ -z "$PREFIX" ]; then
            case "$BR" in
              master|main) PREFIX=s1 ;;   # 推 master/main 也归 S1 部署
            esac
          fi
          echo "prefix=${PREFIX:-none}" >> "$GITHUB_OUTPUT"
          echo "分支=$BR  解析出模块前缀=$PREFIX"

      - name: 编译并测试对应后端模块
        run: |
          P="${{ steps.meta.outputs.prefix }}"
          case "$P" in
            s1) mvn -q -pl packages/m03-bim-gis/backend -am test ;;
            s4) mvn -q -pl packages/m04-delivery/backend  -am test ;;
            none) echo "非 s 前缀分支，跳过测试" ;;
            *)    echo "模块 $P 尚未配置测试，跳过" ;;
          esac

  # ========== 第 2 步：测试过了 → 自动构建 + 部署我自己那个模块 ==========
  deploy:
    needs: test
    if: needs.test.outputs.prefix != 'none' && needs.test.outputs.prefix != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/m03-bim-gis/frontend/package-lock.json

      - name: 解析前缀
        id: meta
        run: |
          BR="${{ github.ref_name }}"
          PREFIX=$(echo "$BR" | grep -oE '^s[1-5]' | head -1)
          if [ -z "$PREFIX" ]; then
            case "$BR" in
              master|main) PREFIX=s1 ;;
            esac
          fi
          echo "prefix=${PREFIX:-none}" >> "$GITHUB_OUTPUT"

      # ---------- S1 完整链路（已部署，可直接用）----------
      - name: 云端构建 S1 后端 jar
        if: steps.meta.outputs.prefix == 's1'
        run: mvn -q -pl packages/m03-bim-gis/backend -am package -DskipTests

      - name: 云端构建 S1 前端
        if: steps.meta.outputs.prefix == 's1'
        working-directory: packages/m03-bim-gis/frontend
        run: |
          npm ci
          npm run build

      - name: 上传 S1 产物到服务器
        if: steps.meta.outputs.prefix == 's1'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "packages/m03-bim-gis/backend/target/m03-bim-gis-1.0.0.jar,packages/m03-bim-gis/frontend/dist"
          target: "/www/wwwroot/__ci_upload"
          strip_components: 5

      - name: 服务器上替换并重启 S1
        if: steps.meta.outputs.prefix == 's1'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            # 后端 jar 重命名为启动脚本期望的固定名
            mv -f /www/wwwroot/__ci_upload/m03-bim-gis-1.0.0.jar /www/wwwroot/xind2-backend/m03-backend.jar
            # 前端整目录覆盖（dist 内含 cesium）
            rm -rf /www/wwwroot/portal/modules/m03
            mkdir -p /www/wwwroot/portal/modules/m03
            cp -r /www/wwwroot/__ci_upload/dist/. /www/wwwroot/portal/modules/m03/
            # 重启后端（内联启动，不依赖 start-m03.sh；注入 MySQL 密码）
            pkill -f 'm03-backend.jar' || true
            sleep 2
            cd /www/wwwroot/xind2-backend
            export MYSQL_PASSWORD='CHANGE_ME'
            nohup java -jar m03-backend.jar --server.port=8083 > m03-backend.log 2>&1 &
            echo "S1 部署完成"

      # ---------- 其他模块：复制上面 S1 的 4 步，改路径即可 ----------
      # s4) source 换成 packages/m04-delivery/backend/target/*.jar + 前端 dist
      #     target 目录、启动脚本换成你们 s4 在服务器上的实际路径
      # s2/s3/s5) 同理，先把服务器侧目录和启动脚本准备好，再补这段
      - name: 未配置部署的模块提示
        if: steps.meta.outputs.prefix != 's1'
        run: echo "模块 ${{ steps.meta.outputs.prefix }} 的部署步骤尚未配置，请在 deploy.yml 中按 S1 模板补充"
