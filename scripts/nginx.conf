# 通信基建数智化平台 — Nginx 增强配置
# 生产部署时将 localhost 改为对应服务容器名
# Docker: docker-compose.yml 中服务名自动解析

# ── 限流区域定义 ──
# $binary_remote_addr: 按客户端IP限流，比 $remote_addr 省内存
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── 上游服务映射 ──
# Docker 环境下自动解析服务名；本地开发使用 localhost
# 部署时取消注释 Docker 地址，注释掉本地地址
# map $host $m01_backend { default "http://127.0.0.1:8080"; }
# map $host $m03_backend { default "http://127.0.0.1:8083"; }
# map $host $m04_backend { default "http://127.0.0.1:8084"; }
# map $host $m05_backend { default "http://127.0.0.1:8085"; }
# map $host $screen_backend { default "http://127.0.0.1:8087"; }

server {
    listen 80;
    server_name localhost;

    # ── 全局安全头 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS: 仅在 HTTPS 环境启用（生产部署时取消注释）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 通用限流 ──
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 20;

    # M06 门户前端
    location / {
        root /usr/share/nginx/html/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # M03 BIM+GIS 前端
    location /modules/m03/ {
        alias /usr/share/nginx/html/modules/m03/;
        index index.html;
        try_files $uri $uri/ /modules/m03/index.html;
    }

    # M04 数智交付前端
    location /modules/m04/ {
        alias /usr/share/nginx/html/modules/m04/;
        index index.html;
        try_files $uri $uri/ /modules/m04/index.html;
    }

    # M05 智慧运维前端
    location /modules/m05/ {
        alias /usr/share/nginx/html/modules/m05/;
        index index.html;
        try_files $uri $uri/ /modules/m05/index.html;
    }

    # 大屏中心前端
    location /modules/screen/ {
        alias /usr/share/nginx/html/modules/screen/;
        index index.html;
        try_files $uri $uri/ /modules/screen/index.html;
    }

    # ── 后端 API 代理 ──

    # M01 认证后端（登录接口单独限流）
    location /api/m01/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080/api/m01/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/m01/ {
        proxy_pass http://127.0.0.1:8080/api/m01/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # M03 BIM+GIS 后端
    location /api/m03/ {
        proxy_pass http://127.0.0.1:8083/api/m03/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # M04 数智交付后端
    location /api/m04/ {
        proxy_pass http://127.0.0.1:8084/api/m04/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # M05 智慧运维后端
    location /api/m05/ {
        proxy_pass http://127.0.0.1:8085/api/m05/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 大屏中心后端
    location /api/screen/ {
        proxy_pass http://127.0.0.1:8087/api/screen/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Actuator 监控端点（仅内网访问） ──
    location /actuator/ {
        # allow 127.0.0.1;    # 仅允许本机
        # allow 172.16.0.0/12; # Docker 内部网络
        # deny all;            # 拒绝外部
        proxy_pass http://127.0.0.1:8080/actuator/;
        proxy_set_header Host $host;
    }

    # ── 通用代理参数 ──
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering off;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
    gzip_vary on;
}
