# 通信基建数智化平台 — Nginx 增强配置
#
# 本文件为「裸金属生产服务器」(阿里云 ECS 47.122.117.17, AApanel/oneinstack 风格)
# 的规范配置，web 根目录与 deploy-s1.sh 的推送目标保持一致：/www/wwwroot/portal
#   - 前端总入口(m06 门户) : /www/wwwroot/portal
#   - M03 前端             : /www/wwwroot/portal/modules/m03   (deploy-s1.sh REMOTE_DIST)
#   - 后端统一经 127.0.0.1 反代
# Docker 环境请用 docker-compose 内的服务名解析，路径另见容器镜像。
#
# ⚠️ 若线上出现 /modules/m03/ 404 或 Cesium 地球白屏，99% 是服务器上的 nginx
#    site 配置被改脏(如 luawaf 被注释、残留测试 location 拦截 /modules/m03/)，
#    或 web 根目录与下方不一致。修复：用本文件覆盖服务器配置后 `nginx -s reload`。


# ── 限流区域定义 ──
# $binary_remote_addr: 按客户端IP限流，比 $remote_addr 省内存
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── 上游服务映射 ──
# Docker 环境下自动解析服务名；本地开发使用 localhost
# 部署时取消注释 Docker 地址，注释掉本地地址
# map $host $m01_backend { default "http://127.0.0.1:8080"; }
# map $host $m03_backend { default "http://127.0.0.1:8083"; }
# map $host $m04_backend { default "http://127.0.0.1:8084"; }
# map $host $m05_backend { default "http://127.0.0.1:8085"; }
# map $host $screen_backend { default "http://127.0.0.1:8087"; }

server {
    listen 80;
    server_name localhost;

    # ── 全局安全头 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS: 仅在 HTTPS 环境启用（生产部署时取消注释）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 通用限流 ──
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 20;

    # M06 门户前端（总入口）
    location / {
        root /www/wwwroot/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # M03 BIM+GIS 前端  ← deploy-s1.sh 推送到 /www/wwwroot/portal/modules/m03
    # 必须能服务子目录 /modules/m03/cesium/(Cesium.js/Widgets/Workers/Assets/ThirdParty)
    # 与 /modules/m03/assets/(打包产物)。若 Cesium 白屏，先 curl 这两个路径是否 200。
    location /modules/m03/ {
        alias /www/wwwroot/portal/modules/m03/;
        index index.html;
        try_files $uri $uri/ /modules/m03/index.html;
    }

    # M04 数智交付前端
    location /modules/m04/ {
        alias /www/wwwroot/portal/modules/m04/;
        index index.html;
        try_files $uri $uri/ /modules/m04/index.html;
    }

    # M05 智慧运维前端
    location /modules/m05/ {
        alias /www/wwwroot/portal/modules/m05/;
        index index.html;
        try_files $uri $uri/ /modules/m05/index.html;
    }

    # 大屏中心前端
    location /modules/screen/ {
        alias /www/wwwroot/portal/modules/screen/;
        index index.html;
        try_files $uri $uri/ /modules/screen/index.html;
    }

    # ── 后端 API 代理 ──

    # M01 认证后端（登录接口单独限流）
    location /api/m01/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080/api/m01/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/m01/ {
        proxy_pass http://127.0.0.1:8080/api/m01/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # M03 BIM+GIS 后端
    location /api/m03/ {
        proxy_pass http://127.0.0.1:8083/api/m03/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # M04 数智交付后端
    location /api/m04/ {
        proxy_pass http://127.0.0.1:8084/api/m04/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # M05 智慧运维后端
    location /api/m05/ {
        proxy_pass http://127.0.0.1:8085/api/m05/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 大屏中心后端
    location /api/screen/ {
        proxy_pass http://127.0.0.1:8087/api/screen/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Actuator 监控端点（仅内网访问） ──
    location /actuator/ {
        # allow 127.0.0.1;    # 仅允许本机
        # allow 172.16.0.0/12; # Docker 内部网络
        # deny all;            # 拒绝外部
        proxy_pass http://127.0.0.1:8080/actuator/;
        proxy_set_header Host $host;
    }

    # ── 通用代理参数 ──
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering off;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
    gzip_vary on;
}
